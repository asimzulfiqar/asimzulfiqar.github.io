backend:
  name: github
  repo: asimzulfiqar/asimzulfiqar.github.io
  branch: master
  base_url: https://api.netlify.com
  auth_endpoint: auth

# Uncomment for local testing
# local_backend: true

media_folder: "assets/img"
public_folder: "/assets/img"

collections:
  # Notes Collection
  - name: "notes"
    label: "Notes"
    label_singular: "Note"
    folder: "_notes"
    create: true
    slug: "{{slug}}"
    editor:
      preview: true
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "post" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Tags", name: "tags", widget: "list", default: ["iot"] }
      - { label: "Inline", name: "inline", widget: "hidden", default: false }
      - { label: "Related Posts", name: "related_posts", widget: "hidden", default: false }
      - { label: "Body", name: "body", widget: "markdown" }

  # Blog Posts Collection
  - name: "posts"
    label: "Blog Posts"
    label_singular: "Post"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    editor:
      preview: true
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "post" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Tags", name: "tags", widget: "list", default: ["iot"] }
      - { label: "Categories", name: "categories", widget: "list", required: false }
      - { label: "Featured", name: "featured", widget: "boolean", default: false, required: false }
      - { label: "Comments", name: "giscus_comments", widget: "boolean", default: true, required: false }
      - { label: "Thumbnail", name: "thumbnail", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  # Projects Collection
  - name: "projects"
    label: "Projects"
    label_singular: "Project"
    folder: "_projects"
    create: true
    slug: "{{slug}}"
    editor:
      preview: false
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "page" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Image", name: "img", widget: "image", required: false }
      - { label: "Importance", name: "importance", widget: "number", default: 3, value_type: "int", min: 1, max: 5 }
      - { label: "Category", name: "category", widget: "select", options: ["work", "fun"] }
      - { label: "Related Publications", name: "related_publications", widget: "hidden", default: false }
      - { label: "Body", name: "body", widget: "markdown" }

  # Pages Collection
  - name: "pages"
    label: "Pages"
    label_singular: "Page"
    files:
      - label: "About"
        name: "about"
        file: "_pages/about.md"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "about" }
          - { label: "Title", name: "title", widget: "hidden", default: "About" }
          - { label: "Permalink", name: "permalink", widget: "hidden", default: "/" }
          - { label: "Subtitle", name: "subtitle", widget: "string" }
          - label: "Profile"
            name: "profile"
            widget: "object"
            fields:
              - { label: "Align", name: "align", widget: "select", options: ["left", "right"] }
              - { label: "Image", name: "image", widget: "string" }
              - { label: "Circular", name: "image_circular", widget: "boolean" }
              - { label: "More Info", name: "more_info", widget: "text", required: false }
          - { label: "Show News", name: "news", widget: "boolean", default: false }
          - { label: "Show Selected Papers", name: "selected_papers", widget: "boolean", default: false }
          - { label: "Show Social", name: "social", widget: "boolean", default: true }
          - { label: "Body", name: "body", widget: "markdown" }

      - label: "Services"
        name: "services"
        file: "_pages/services.md"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "page" }
          - { label: "Title", name: "title", widget: "hidden", default: "Services" }
          - { label: "Permalink", name: "permalink", widget: "hidden", default: "/services/" }
          - { label: "Description", name: "description", widget: "text" }
          - { label: "Show in Nav", name: "nav", widget: "hidden", default: true }
          - { label: "Nav Order", name: "nav_order", widget: "hidden", default: 1 }
          - { label: "Body", name: "body", widget: "markdown" }
